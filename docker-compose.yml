name: bizmate

networks:
  default:
    name: bizmate

services:
  postgresdb:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: genos
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bizmatedb
    ports:
      - 5432:5432
    volumes:
      - ./.data/postgresDb:/var/lib/postgresql/data

  mongodb:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: genos
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: bizmatedb
    ports:
      - 27017:27017
    volumes:
      - ./.data/mongoDb:/data/db
